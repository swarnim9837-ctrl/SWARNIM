<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Product Page - Simple</title>

    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #ffffff;
    color: #111;
    padding: 20px;
}

.outer-box {
    border: 2px solid black;
    padding: 20px;
    width: 90%;
    margin: auto;
    background: #f7f8fb;
}

.site-header {
    display: block;
    background: #222;
    color: #fff;
    padding: 12px;
    text-align: center;
    margin-bottom: 18px;
}

.container {
    max-width: 420px;
    margin: 0 auto;
}

.product-card {
    background: #fff;
    border: 1px solid #e0e4ef;
    padding: 12px;
    width: 100%;
    height: auto;
    border-radius: 6px;
}

.product-image {
    width: 100%;
    height: auto;              
    object-fit: contain;       
    display: block;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    background: #fff;         
}


.product-title {
    font-size: 18px;
    margin-bottom: 6px;
}

.product-desc {
    font-size: 14px;
    color: #444;
    margin-bottom: 10px;
}

.price-row {
    margin-bottom: 12px;
}

.price {
    font-weight: 700;
    color: #0b6b3a;
    margin-right: 8px;
}

.old-price {
    color: #888;
    text-decoration: line-through;
}

.add-cart {
    display: block;
    width: 100%;
    padding: 10px;
    background: #0066cc;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
}

.add-cart:hover {
    background: #0052a3;
}

@media (max-width: 320px) {
    .product-image {
        height: 150px;
    }
}
    </style>
</head>

<body>

<div class="outer-box">

    <header class="site-header">
        <h1>Flipkart</h1>
    </header>

    <main class="container">
        <section class="product-card">
            
            <img class="product-image" 
                 src="https://rukminim2.flixcart.com/image/612/612/xif0q/watch/i/9/0/-original-imahfsz8ddeprqpf.jpeg?q=70"
                 alt="Product">

            <h2 class="product-title">Dressberry <br>Analog Watch - For Women</h2>

            <p class="product-desc">
                Elegance on Your Wrist. Where Style Meets Time.
            </p>

            <div class="price-row">
                <span class="price">₹799</span>
                <span class="old-price">₹3,299</span>
            </div>

            <button class="add-cart">Add to Cart</button>
        </section>
    </main>

</div> 

</body>
</html>
