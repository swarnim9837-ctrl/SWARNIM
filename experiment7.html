<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Aligned Dual Navigation</title>

    <style>
        .nav-section {
            background: #333;
            padding: 15px 30px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-container {
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        .top-nav,
        .bottom-nav {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 8px 0;
            padding: 0;
            justify-content: flex-end; 
        }

        .top-nav a,
        .bottom-nav a {
            text-decoration: none;
            color: white;
            padding: 6px 14px;
            font-size: 17px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .top-nav a:hover,
        .bottom-nav a:hover {
            background: rgba(211, 211, 211, 0.603);
            color: #333;
        }

        .right-links {
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="nav-section">

        <div class="nav-container">
            <div class="logo">MyWebsite</div>

            <div class="right-links">
                <ul class="top-nav">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>

                <ul class="bottom-nav">
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">Messages</a></li>
                    <li><a href="#">Profile</a></li>
                    <li><a href="#">Logout</a></li>
                </ul>
            </div>

        </div>
    </div>

</body>
</html>
